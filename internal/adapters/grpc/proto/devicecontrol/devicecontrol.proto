syntax = "proto3";

package devicecontrol;

option go_package = "mqtt-api-service/internal/adapters/grpc/proto/devicecontrol";

service DeviceControlService {

  rpc SetPower(SetPowerRequest)
      returns (CommandResponse);

  rpc SetTemperature(SetTemperatureRequest)
      returns (CommandResponse);
}

message SetPowerRequest {
  string device_id = 1;
  bool power = 2;
}

message SetTemperatureRequest {
  string device_id = 1;
  double temperature = 2;
}

message CommandResponse {
  bool success = 1;
  string message = 2;
}