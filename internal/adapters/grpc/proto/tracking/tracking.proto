syntax = "proto3";

package tracking;

option go_package = "github.com/aaron/mqtt-adapter-service/proto/tracking;tracking";

service TrackingService {
  rpc IngestRaw (RawMessage) returns (Ack);
}

message RawMessage {
  string topic = 1;
  bytes payload = 2;
  int32 qos = 3;
  bool retain = 4;
  string received_at = 5;
}

message Ack {
  bool ok = 1;
}