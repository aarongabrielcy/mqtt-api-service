services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mqtt-api-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./.env:/app/.env:ro
      - ./certs:/app/certs:ro
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - REDIS_ADDR=redis:6379
    depends_on:
      - mongo
      - redis
    networks:
      - mqtt-api-net

  grpc-mock-server:
    build:
      context: ../grpc-mock-server
      dockerfile: Dockerfile
    container_name: tracking-grpc-mock
    restart: unless-stopped
    ports:
      - "50051:50051"
    networks:
      - mqtt-api-net

  mongo:
    image: mongo:7
    container_name: mqtt-api-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mqtt-api-net

  redis:
    image: redis:7-alpine
    container_name: mqtt-api-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mqtt-api-net

volumes:
  mongo_data:
  redis_data:

networks:
  mqtt-api-net:
    driver: bridge